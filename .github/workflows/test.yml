name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # No install step: both suites are stdlib-only.
      - run: node tests/run.js
      - run: node vpn/tests/run.js
